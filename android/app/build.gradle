plugins {
    id "com.android.application"
}

android {
    namespace "com.rasheed.atvu"
    compileSdk 34

    defaultConfig {
        applicationId "com.rasheed.atvu"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "0.2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The page in ../web is copied into the app's assets at build time (assets/web/...).
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("generated/webassets")
    }
}

def copyWeb = tasks.register("copyWeb", Sync) {
    from rootProject.file("../web")
    into layout.buildDirectory.dir("generated/webassets/web")
    exclude "**/*.wav"
}
tasks.named("preBuild") { dependsOn copyWeb }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
