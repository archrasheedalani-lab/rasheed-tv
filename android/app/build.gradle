plugins {
    id "com.android.application"
}

// The release signing key lives outside the project (never in git): ~/.rasheed-tv-signing/keystore.properties,
// or the file ATVU_KEYSTORE points to. Without it, release builds come out unsigned.
def keyProps = new Properties()
def keyFile = file(System.getenv("ATVU_KEYSTORE") ?: "${System.getProperty("user.home")}/.rasheed-tv-signing/keystore.properties")
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace "com.rasheed.atvu"
    compileSdk 34

    defaultConfig {
        applicationId "com.rasheed.atvu"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "0.2.4"
    }

    signingConfigs {
        release {
            if (keyProps.storeFile) {
                storeFile file(keyProps.storeFile)
                storePassword keyProps.storePassword
                keyAlias keyProps.keyAlias
                keyPassword keyProps.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyProps.storeFile ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The page in ../web is copied into the app's assets at build time (assets/web/...).
    // Debug (your own TV) keeps web/audio/adhan.mp3; release (the file you share) leaves recordings out.
    sourceSets {
        debug.assets.srcDirs += layout.buildDirectory.dir("generated/webassets-debug")
        release.assets.srcDirs += layout.buildDirectory.dir("generated/webassets-release")
    }
}

def copyWebDebug = tasks.register("copyWebDebug", Sync) {
    from rootProject.file("../web")
    into layout.buildDirectory.dir("generated/webassets-debug/web")
    exclude "**/*.wav"
}
def copyWebRelease = tasks.register("copyWebRelease", Sync) {
    from rootProject.file("../web")
    into layout.buildDirectory.dir("generated/webassets-release/web")
    exclude "**/*.wav", "**/*.mp3", "**/*.ogg", "**/*.m4a"
}
tasks.named("preBuild") { dependsOn copyWebDebug, copyWebRelease }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
